<svg viewBox="0 0 520 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Blue Gradient for Outer Swoosh -->
    <linearGradient id="logoBlueSwoosh" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#073B75" />
    </linearGradient>

    <!-- Lower Orange Curved Ribbon -->
    <linearGradient id="logoOrangeRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- 3D Globe Orange Gradient -->
    <radialGradient id="logoGlobeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="25%" stop-color="#FB923C" />
      <stop offset="65%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </radialGradient>

    <!-- Green Bars Gradients -->
    <linearGradient id="logoGreenBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="logoGreenBar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="logoGreenBar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>

    <!-- Ascending Arrow Gradient -->
    <linearGradient id="logoArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Group: Emblem Graphic (Left) -->
  <g transform="translate(10, 5) scale(0.65)">
    <!-- 1. Orange 3D Globe / Sphere Base -->
    <path
      d="M 64 105 C 65 148, 145 152, 146 105 C 138 132, 105 142, 78 132 C 69 123, 65 114, 64 105 Z"
      fill="url(#logoGlobeGrad)"
    />
    <circle cx="106" cy="115" r="38" fill="url(#logoGlobeGrad)" />
    <path
      d="M 76 122 C 86 146, 126 146, 136 122 C 124 138, 96 141, 76 122 Z"
      fill="#9A3412"
      opacity="0.4"
    />
    <ellipse cx="106" cy="108" rx="32" ry="8" fill="#FFFFFF" opacity="0.2" />

    <!-- 2. Orange Outer Crescent Accent -->
    <path
      d="M 46 112 C 50 96, 62 88, 76 89 C 62 96, 52 108, 51 122 C 46 119, 45 115, 46 112 Z"
      fill="url(#logoOrangeRibbon)"
    />

    <!-- 3. Dynamic Outer Blue Ring / Swoosh -->
    <path
      d="M 48 102 C 43 56, 92 28, 142 46 C 152 51, 159 58, 164 66 C 142 45, 98 44, 66 68 C 55 78, 50 90, 48 102 Z"
      fill="url(#logoBlueSwoosh)"
    />
    <path
      d="M 45 114 C 48 129, 60 141, 78 146 C 58 136, 50 121, 52 108 C 53 96, 60 85, 71 78 C 58 88, 45 99, 45 114 Z"
      fill="url(#logoBlueSwoosh)"
    />

    <!-- 4. Three Stepped Green Growth Bars -->
    <rect x="74" y="94" width="13" height="24" rx="3.5" fill="url(#logoGreenBar1)" />
    <rect x="92" y="72" width="13" height="46" rx="3.5" fill="url(#logoGreenBar2)" />
    <rect x="110" y="56" width="13" height="62" rx="3.5" fill="url(#logoGreenBar3)" />
    <path d="M 68 116 L 76 116 L 87 116 L 105 116 L 123 116" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" />

    <!-- 5. Ascending Growth Arrow -->
    <path
      d="M 54 116 C 74 114, 84 126, 101 118 C 119 108, 141 86, 161 58 L 149 55 L 175 44 L 171 71 L 160 63 C 138 93, 113 115, 96 123 C 79 131, 66 123, 54 116 Z"
      fill="url(#logoArrowGrad)"
      stroke="#0369A1"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <path
      d="M 68 118 C 88 116, 113 101, 141 73 L 165 52"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>

  <!-- Group: Typography (Right) -->
  <g transform="translate(140, 20)">
    <!-- Line 1: NATIONAL -->
    <text x="0" y="36" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" fill="#0B477D">
      NATIONAL
    </text>
    <!-- Line 2: PROCUREMENT AGENT -->
    <text x="0" y="68" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.2" fill="#EA580C">
      PROCUREMENT AGENT
    </text>
    <!-- Separator Line -->
    <line x1="0" y1="80" x2="360" y2="80" stroke="#CBD5E1" stroke-width="1.2" />
    <!-- Line 3: Innovation and Solution Hub -->
    <text x="0" y="98" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="17" font-weight="500" font-style="italic" fill="#526071">
      Innovation and Solution Hub
    </text>
  </g>
</svg>
